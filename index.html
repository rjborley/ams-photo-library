<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AMS Photo Library</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F6F3;--surface:#FFF;--surface2:#F0EEE9;--border:#E2DED7;--text:#1A1916;--text-s:#6B6760;--text-m:#9E9B96;--accent:#2B5E3A;--accent-l:#E8F0EB;--accent-h:#224B2E;--qc:#7B3F00;--qc-bg:#FDF0E7;--sales:#1A4F7A;--sales-bg:#E8F1F9;--retail:#4A3080;--retail-bg:#EFE9F9;--visit:#2B5E3A;--visit-bg:#E8F0EB;--other:#555;--other-bg:#F0F0F0;--danger:#C0392B;--r:8px;--rl:12px;--sh:0 1px 4px rgba(0,0,0,.08),0 2px 12px rgba(0,0,0,.04);--shl:0 4px 24px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--surface:#1E1D1B;--surface2:#272521;--border:#333129;--text:#F0EDE8;--text-s:#A09D98;--text-m:#6B6860;--accent:#4A8F5E;--accent-l:#1A2E20;--accent-h:#5BA070;--qc-bg:#2A1A0A;--sales-bg:#0A1A2A;--retail-bg:#1A1228;--visit-bg:#0F1E14;--other-bg:#252525}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.header-logo{height:32px;width:auto;display:block}
.header-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:background .15s;font-family:inherit;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-h)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-ghost{background:transparent;color:var(--text-s);border:1px solid transparent}.btn-ghost:hover{background:var(--surface2)}
.btn-danger{background:var(--danger);color:#fff}.btn-sm{padding:5px 10px;font-size:12px}
.main{max-width:1200px;margin:0 auto;padding:20px 16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:20px;box-shadow:var(--sh)}
.panel-title{font-size:15px;font-weight:600;margin-bottom:16px}
.drop-zone{border:2px dashed var(--border);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--surface2)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-l)}
.drop-icon{font-size:28px;margin-bottom:8px}.drop-text{font-size:14px;color:var(--text-s);margin-bottom:3px}.drop-sub{font-size:12px;color:var(--text-m)}
input[type=file]{display:none}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px;margin-top:14px}
.preview-item{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:1;border:1px solid var(--border)}
.preview-img{width:100%;height:100%;object-fit:cover;display:block}
.preview-remove{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tag-form{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.tag-form{grid-template-columns:1fr}}
.tag-form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--text-s)}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:65px}
.compress-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-s);cursor:pointer;user-select:none}
.compress-toggle input{cursor:pointer;accent-color:var(--accent)}
.form-actions{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.progress-wrap{margin-top:12px}
.progress-track{background:var(--surface2);border-radius:4px;height:4px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.upload-status{margin-top:8px;font-size:12px;color:var(--text-s);min-height:16px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-m);font-size:13px;pointer-events:none}
.search-input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.search-input:focus{border-color:var(--accent)}
.filter-select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;outline:none}
.count-bar{display:flex;align-items:center;margin-bottom:14px}
.count-text{color:var(--text-s);font-size:13px}
.select-bar{display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:var(--accent-l);border:1px solid var(--accent);border-radius:var(--r);margin-bottom:14px;font-size:13px;color:var(--accent)}
.select-bar-top{display:flex;align-items:center;justify-content:space-between}
.select-bar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.select-bar-count{font-weight:500}
.btn-sel-active{background:var(--accent-l);color:var(--accent);border:1px solid var(--accent)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media(max-width:480px){.photo-grid{grid-template-columns:repeat(2,1fr);gap:9px}}
.photo-card{background:var(--surface);border-radius:var(--rl);overflow:hidden;border:1px solid var(--border);box-shadow:var(--sh);cursor:pointer;transition:box-shadow .15s,transform .15s}
.photo-card:hover{box-shadow:var(--shl);transform:translateY(-2px)}
.photo-card.selected{outline:2px solid var(--accent);outline-offset:2px}
.photo-thumb-wrap{position:relative}
.photo-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2)}
.photo-thumb-placeholder{width:100%;aspect-ratio:4/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text-m);font-size:26px}
.card-check{position:absolute;top:7px;left:7px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px}
.photo-card.selected .card-check{background:var(--accent);border-color:var(--accent);color:#fff}
.photo-info{padding:9px 11px 11px}
.photo-cat{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.4px;padding:2px 6px;border-radius:4px;margin-bottom:5px;text-transform:uppercase}
.cat-qc{color:var(--qc);background:var(--qc-bg)}.cat-sales{color:var(--sales);background:var(--sales-bg)}.cat-retail{color:var(--retail);background:var(--retail-bg)}.cat-visit{color:var(--visit);background:var(--visit-bg)}.cat-other{color:var(--other);background:var(--other-bg)}
.photo-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.photo-fname{font-size:11px;color:var(--text-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,'SF Mono',Menlo,monospace;margin-bottom:2px}
.photo-meta{font-size:11px;color:var(--text-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-state{text-align:center;padding:56px 16px;color:var(--text-s)}
.empty-icon{font-size:44px;margin-bottom:14px;opacity:.4}.empty-title{font-size:16px;font-weight:500;margin-bottom:7px;color:var(--text)}.empty-sub{font-size:13px}
.loading-state{display:flex;align-items:center;justify-content:center;padding:44px;gap:10px;color:var(--text-s)}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border-radius:var(--rl);max-width:840px;width:100%;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shl)}
.modal-img-wrap{flex:1;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;max-height:54vh}
.modal-img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.modal-body{padding:18px 22px;overflow-y:auto}
.modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer;color:var(--text)}
.modal-close:hover{background:var(--border)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.meta-item .ml{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-m);margin-bottom:2px}
.meta-item .mv{font-size:13px;color:var(--text)}.meta-item .mv.empty{color:var(--text-m);font-style:italic}
.modal-desc{background:var(--surface2);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--text-s);margin-bottom:14px;border:1px solid var(--border)}
.modal-footer{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.uploader-by{font-size:11px;color:var(--text-m);flex:1}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:2000;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:var(--r);font-size:13px;box-shadow:var(--shl);animation:slideIn .2s ease}
.toast.error{background:var(--danger);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<div class="main">
  <div class="panel" id="uploadPanel" style="display:none">
    <div class="panel-title">Add Photos to Library</div>
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">📷</div>
      <div class="drop-text">Drag photos here, or tap to select</div>
      <div class="drop-sub">JPG, PNG, WEBP · up to 32 MB each · multiple at once</div>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <div class="preview-grid" id="previewGrid"></div>
    <div class="tag-form" id="tagForm" style="display:none">
      <div class="field"><label>Category *</label>
        <select id="fCategory"><option value="">Select category…</option><option value="QC">Quality Control</option><option value="Sales">Sales</option><option value="Retail">Retail Store</option><option value="Visit">Visit / Trip / Show</option><option value="Other">Other</option></select>
      </div>
      <div class="field"><label>Product</label><input id="fProduct" type="text" placeholder="e.g. Cherries, Asparagus…"></div>
      <div class="field"><label>Company / Grower</label><input id="fCompany" type="text" placeholder="Supplier or customer name"></div>
      <div class="field"><label>Contact Name</label><input id="fContact" type="text" placeholder="Person at company"></div>
      <div class="field"><label>Consignment Ref</label><input id="fConsignment" type="text" placeholder="e.g. C00350"></div>
      <div class="field"><label>Location / Region</label><input id="fLocation" type="text" placeholder="e.g. Dubai, Egypt, Cheltenham"></div>
      <div class="field full"><label>Description / Notes</label><textarea id="fDescription" placeholder="Any useful context…"></textarea></div>
    </div>
    <div id="progressWrap" style="display:none">
      <div class="progress-track"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
      <div class="upload-status" id="uploadStatus"></div>
    </div>
    <div class="form-actions" id="formActions" style="display:none">
      <button class="btn btn-primary" id="uploadBtn">Upload to Library</button>
      <label class="compress-toggle"><input type="checkbox" id="compressToggle" checked><span>Compress images</span></label>
      <button class="btn btn-secondary" id="cancelUploadBtn">Cancel</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="search-wrap"><span class="search-icon">🔍</span><input class="search-input" id="searchInput" type="text" placeholder="Search product, company, consignment, location…"></div>
    <select class="filter-select" id="filterCategory"><option value="">All categories</option><option value="QC">Quality Control</option><option value="Sales">Sales</option><option value="Retail">Retail Store</option><option value="Visit">Visit / Trip / Show</option><option value="Other">Other</option></select>

const setProgress=p=>el('progressBar').style.width=p+'%';
const setStatus=m=>el('uploadStatus').textContent=m;

function toast(msg,type){const d=document.createElement('div');d.className='toast'+(type==='error'?' error':'');d.textContent=msg;el('toastWrap').appendChild(d);setTimeout(()=>d.remove(),3500);}

function makeUID(name,compressed){
  const d=new Date().toISOString().slice(0,10).replace(/-/g,''),u=Math.random().toString(36).slice(2,10);
  const base=name.replace(/\.[^.]+$/,''),ext=compressed?'jpg':(name.split('.').pop().toLowerCase()||'jpg');
  return 'AMS_'+d+'_'+u+'_'+base+'.'+ext;
}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});}
function compressImage(file){
  return new Promise(resolve=>{
    if(file.size<=COMPRESS_THRESHOLD){resolve({blob:file,compressed:false,originalSize:file.size,finalSize:file.size});return;}
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let{width:w,height:h}=img;
      if(w>COMPRESS_MAX_PX||h>COMPRESS_MAX_PX){const r=Math.min(COMPRESS_MAX_PX/w,COMPRESS_MAX_PX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(blob=>resolve({blob,compressed:true,originalSize:file.size,finalSize:blob.size}),'image/jpeg',COMPRESS_QUALITY);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve({blob:file,compressed:false,originalSize:file.size,finalSize:file.size});};
    img.src=url;
  });
}

function renderGallery(){
  const q=(el('searchInput').value||'').toLowerCase(),cat=el('filterCategory').value;
  const filtered=photos.filter(p=>{
    if(cat&&p.category!==cat)return false;
    if(!q)return true;
    return[p.product,p.company,p.contact,p.consignment,p.location,p.description,p.category,p.uniqueFilename,p.originalFilename].some(v=>v&&v.toLowerCase().includes(q));
  });
  el('countText').textContent=photos.length===0?'':filtered.length===photos.length?photos.length+' photo'+(photos.length!==1?'s':''):filtered.length+' of '+photos.length+' photos';
  const g=el('galleryState');
  if(!photos.length){g.innerHTML='<div class="empty-state"><div class="empty-icon">📷</div><div class="empty-title">No photos yet</div><div class="empty-sub">Tap "+ Add Photos" to upload your first batch</div></div>';return;}
  if(!filtered.length){g.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No photos match</div><div class="empty-sub">Try a different search or filter</div></div>';return;}
  g.innerHTML='<div class="photo-grid">'+filtered.map(p=>{
    const cc=CATS[p.category]||'cat-other';
    const title=[p.product,p.company].filter(Boolean).join(' · ')||p.uniqueFilename||'Untitled';
    const meta=[p.consignment,p.location,fmtDate(p.addedAt)].filter(Boolean).join(' · ');
    const isSel=selectedIds.has(p.id);
    return'<div class="photo-card'+(selectMode?' selectable':'')+(isSel?' selected':'')+'" data-id="'+esc(p.id)+'" data-action="'+(selectMode?'sel':'open')+'">'
      +'<div class="photo-thumb-wrap">'+(p.imgbbUrl?'<img class="photo-thumb" src="'+esc(p.imgbbUrl)+'" loading="lazy">':'<div class="photo-thumb-placeholder">🖼</div>')+(selectMode?'<div class="card-check">'+(isSel?'✓':'')+'</div>':'')+'</div>'
      +'<div class="photo-info"><span class="photo-cat '+cc+'">'+esc(p.category||'Other')+'</span><div class="photo-title">'+esc(title)+'</div>'+(p.uniqueFilename?'<div class="photo-fname">'+esc(p.uniqueFilename)+'</div>':'')+'<div class="photo-meta">'+esc(meta)+'</div></div></div>';
  }).join('')+'</div>';
}

function openPhoto(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  el('modalImg').src=p.imgbbUrl||'';
  const cc=CATS[p.category]||'cat-other';
  const mc=el('modalCat');mc.className='photo-cat '+cc;mc.textContent=p.category||'Other';
  el('modalTitle').textContent=[p.product,p.company].filter(Boolean).join(' · ')||p.uniqueFilename||'Untitled';
  const fields=[{l:'Category',v:p.category},{l:'Product',v:p.product},{l:'Company',v:p.company},{l:'Contact',v:p.contact},{l:'Consignment Ref',v:p.consignment},{l:'Location',v:p.location},{l:'Unique Filename',v:p.uniqueFilename},{l:'Original Filename',v:p.originalFilename},{l:'File Size',v:p.finalSizeBytes?(p.wasCompressed&&p.originalSizeBytes?fmtBytes(p.finalSizeBytes)+' (from '+fmtBytes(p.originalSizeBytes)+')':fmtBytes(p.finalSizeBytes)):null},{l:'Date Added',v:fmtDate(p.addedAt)}];
  el('modalMeta').innerHTML=fields.map(f=>'<div class="meta-item"><div class="ml">'+esc(f.l)+'</div><div class="mv'+(f.v?'':' empty')+'">'+esc(f.v||'—')+'</div></div>').join('');
  const desc=el('modalDesc');desc.style.display=p.description?'':'none';if(p.description)desc.textContent=p.description;
  el('modalUploader').textContent='';
  const dl=el('modalDownload');dl.href=p.imgbbUrl||'#';dl.download=p.uniqueFilename||'image.jpg';
  el('modalDelete').onclick=()=>deleteOne(id);
  el('modalOverlay').style.display='flex';document.body.style.overflow='hidden';
}
function closeModalBtn(){el('modalOverlay').style.display='none';document.body.style.overflow='';}
async function deleteOne(id){
  if(!confirm('Delete this photo? This cannot be undone.'))return;
  try{await db.collection('photos').doc(id).delete();closeModalBtn();toast('Photo deleted');}
  catch(e){toast('Delete failed: '+e.message,'error');}
}

el('uploadToggleBtn').onclick=()=>{const p=el('uploadPanel');const s=p.style.display!=='none';p.style.display=s?'none':'';if(!s)p.scrollIntoView({behavior:'smooth',block:'start'});};
el('cancelUploadBtn').onclick=resetUpload;
const dropZone=el('dropZone'),fileInput=el('fileInput');
dropZone.onclick=()=>fileInput.click();
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('drag-over');};
dropZone.ondragleave=()=>dropZone.classList.remove('drag-over');
dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('drag-over');handleFiles(Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/')));};
fileInput.onchange=()=>{handleFiles(Array.from(fileInput.files));fileInput.value='';};

function handleFiles(files){
  if(!files.length)return;
  pendingFiles=[...pendingFiles,...files];
  el('previewGrid').innerHTML=pendingFiles.map((f,i)=>'<div class="preview-item"><img class="preview-img" src="'+URL.createObjectURL(f)+'"><button class="preview-remove" onclick="removeFile('+i+')">✕</button></div>').join('');
  el('tagForm').style.display='';el('formActions').style.display='';
}
function removeFile(i){pendingFiles.splice(i,1);if(!pendingFiles.length){el('previewGrid').innerHTML='';el('tagForm').style.display='none';el('formActions').style.display='none';}else handleFiles([]);}

el('compressToggle').onchange=function(){if(!this.checked&&!confirm('Upload without compression? Files will be 3-8x larger.\n\nProceed?'))this.checked=true;};

el('uploadBtn').onclick=async()=>{
  if(!pendingFiles.length){toast('No photos selected','error');return;}
  if(!el('fCategory').value){toast('Please choose a category','error');return;}
  const tags={category:el('fCategory').value,product:el('fProduct').value.trim(),company:el('fCompany').value.trim(),contact:el('fContact').value.trim(),consignment:el('fConsignment').value.trim(),location:el('fLocation').value.trim(),description:el('fDescription').value.trim()};
  el('uploadBtn').disabled=true;el('cancelUploadBtn').disabled=true;el('progressWrap').style.display='';
  const sc=el('compressToggle').checked;let done=0;const total=pendingFiles.length;
  for(const file of pendingFiles){
    setProgress(done/total*100);setStatus('Processing '+(done+1)+' of '+total+': '+file.name);
    try{
      const{blob,compressed,originalSize,finalSize}=sc?await compressImage(file):{blob:file,compressed:false,originalSize:file.size,finalSize:file.size};
      const uid=makeUID(file.name,compressed);
      setStatus('Uploading '+(done+1)+' of '+total+': '+uid+' ('+fmtBytes(finalSize)+')');
      const b64=await blobToB64(blob);
      const fd=new FormData();fd.append('key',IMGBB_KEY);fd.append('image',b64.split(',')[1]);fd.append('name',uid);
      const res=await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd});
      const json=await res.json();
      if(!json.success)throw new Error(json.error?.message||'ImgBB failed');
      await db.collection('photos').add({...tags,uniqueFilename:uid,originalFilename:file.name,imgbbUrl:json.data.url,imgbbId:json.data.id,deleteUrl:json.data.delete_url,wasCompressed:compressed,originalSizeBytes:originalSize,finalSizeBytes:finalSize,addedAt:new Date().toISOString(),uploadedByName:null});
      done++;setProgress(done/total*100);
    }catch(e){console.error(e);toast('Failed: '+file.name+' — '+(e.message||'error'),'error');}
  }
  setStatus('Done! '+done+' photo'+(done!==1?'s':'')+' added.');
  toast(done+' photo'+(done!==1?'s':'')+' uploaded');
  setTimeout(()=>{resetUpload();el('uploadPanel').style.display='none';},1800);
};

function resetUpload(){
  pendingFiles=[];el('previewGrid').innerHTML='';el('tagForm').style.display='none';el('formActions').style.display='none';el('progressWrap').style.display='none';
  ['fCategory','fProduct','fCompany','fContact','fConsignment','fLocation'].forEach(id=>el(id).value='');
  el('fDescription').value='';el('compressToggle').checked=true;el('uploadBtn').disabled=false;el('cancelUploadBtn').disabled=false;
  setProgress(0);setStatus('');
}

function toggleSel(id){selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);updateSB();renderGallery();}
function enterSel(){selectMode=true;selectedIds.clear();el('selectModeBtn').classList.add('btn-sel-active');el('selectModeBtn').textContent='Selecting…';el('selectBar').style.display='flex';el('uploadToggleBtn').style.display='none';updateSB();renderGallery();}
function exitSel(){selectMode=false;selectedIds.clear();el('selectModeBtn').classList.remove('btn-sel-active');el('selectModeBtn').textContent='Select';el('selectBar').style.display='none';el('uploadToggleBtn').style.display='';renderGallery();}
function updateSB(){const n=selectedIds.size;el('selectCount').textContent=n===0?'Tap photos to select':n+' photo'+(n!==1?'s':'')+' selected';el('deleteSelectedBtn').disabled=n===0;el('downloadSelectedBtn').disabled=n===0;}
async function deleteSel(){
  const n=selectedIds.size;if(!n)return;
  if(!confirm('Permanently delete '+n+' photo'+(n!==1?'s':'')+'?'))return;
  el('deleteSelectedBtn').disabled=true;el('deleteSelectedBtn').textContent='Deleting…';
  let done=0;for(const id of[...selectedIds]){try{await db.collection('photos').doc(id).delete();done++;}catch(e){console.error(e);}}
  toast(done+' photo'+(done!==1?'s':'')+' deleted');exitSel();
}
async function downloadSelected(){
  const n=selectedIds.size;if(!n)return;
  const selected=photos.filter(p=>selectedIds.has(p.id));
  toast('Downloading '+n+' photo'+(n!==1?'s':'')+'…');
  for(const p of selected){
    if(!p.imgbbUrl)continue;
    try{
      const res=await fetch(p.imgbbUrl);
      const blob=await res.blob();
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=p.uniqueFilename||p.originalFilename||'image.jpg';
      a.click();
      URL.revokeObjectURL(a.href);
      await new Promise(r=>setTimeout(r,400));
    }catch(e){toast('Failed to download '+p.uniqueFilename,'error');}
  }
  toast('Download complete');
}
el('downloadSelectedBtn').onclick=downloadSelected;
el('selectModeBtn').onclick=()=>selectMode?exitSel():enterSel();
el('cancelSelectBtn').onclick=exitSel;
el('selectAllBtn').onclick=()=>{const q=(el('searchInput').value||'').toLowerCase(),cat=el('filterCategory').value;photos.filter(p=>(!cat||p.category===cat)&&(!q||[p.product,p.company,p.contact,p.consignment,p.location,p.description,p.category,p.uniqueFilename,p.originalFilename].some(v=>v&&v.toLowerCase().includes(q)))).forEach(p=>selectedIds.add(p.id));updateSB();renderGallery();};
el('selectNoneBtn').onclick=()=>{selectedIds.clear();updateSB();renderGallery();};
el('deleteSelectedBtn').onclick=deleteSel;

el('backupBtn').onclick=()=>{
  if(!photos.length){toast('No photos to export','error');return;}
  const cols=['uniqueFilename','originalFilename','category','product','company','contact','consignment','location','description','imgbbUrl','addedAt','wasCompressed','finalSizeBytes','originalSizeBytes'];
  const csv=[cols.join(','),...photos.map(p=>cols.map(c=>'"'+String(p[c]!==undefined?p[c]:'').replace(/"/g,'""')+'"').join(','))].join('\n');
  const urls=photos.map(p=>(p.uniqueFilename||'')+'\t'+(p.imgbbUrl||'')).join('\n');
  const txt='=== AMS Photo Library Backup ===\nExported: '+new Date().toISOString()+'\nTotal: '+photos.length+'\n\n=== CSV ===\n'+csv+'\n\n=== IMAGE URLS ===\n'+urls;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='AMS_Backup_'+new Date().toISOString().slice(0,10)+'.txt';a.click();toast('Backup downloaded');
};

el('searchInput').oninput=renderGallery;
el('filterCategory').onchange=renderGallery;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalBtn();});
document.addEventListener('click',e=>{
  const card=e.target.closest('[data-id]');
  if(!card)return;
  const id=card.dataset.id,action=card.dataset.action;
  if(action==='sel')toggleSel(id);
  else openPhoto(id);
});
window.openPhoto=openPhoto;window.closeModalBtn=closeModalBtn;window.toggleSel=toggleSel;window.removeFile=removeFile;

db.collection('photos').orderBy('addedAt','desc').onSnapshot(snap=>{
  photos=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderGallery();
},err=>{
  console.error(err);
  el('galleryState').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Connection error</div><div class="empty-sub">'+esc(err.message)+'</div></div>';
});
</script>
</body>
</html>
